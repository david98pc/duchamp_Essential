name: Build MT6897 APK

on:
  push:
    branches:
      - main
      - mt6897
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt6897-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_ARCHIVE_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK: 27.3.13750724

jobs:
  build:
    name: APK and native runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.pub-cache
          key: mt6897-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'ui/flutter/pubspec.lock') }}
          restore-keys: |
            mt6897-${{ runner.os }}-

      - name: Install host packages
        run: |
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install --yes curl file ninja-build pkg-config unzip zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Flutter SDK
        env:
          FLUTTER_ARCHIVE: flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/$FLUTTER_ARCHIVE" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$FLUTTER_ARCHIVE"
          echo "$FLUTTER_ARCHIVE_SHA256  $RUNNER_TEMP/$FLUTTER_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/flutter-sdk"
          tar --no-same-owner -xJf "$RUNNER_TEMP/$FLUTTER_ARCHIVE" -C "$RUNNER_TEMP/flutter-sdk"
          unlink "$RUNNER_TEMP/$FLUTTER_ARCHIVE"
          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare Flutter
        run: |
          flutter config --no-analytics
          flutter --version
          flutter precache --android
          flutter pub get --directory ui/flutter

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK"

      - name: Prepare Rust ARM64 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add aarch64-linux-android
          rustc --version

      - name: Verify Rust sources
        run: |
          cargo fmt --all --check
          cargo test -p rodin-essential-daemon
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Restore release Flutter embedder
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: |
            runtime/flutter-engine/prebuilt/android-arm64
            runtime/flutter-engine/include/embedder.h
          key: flutter-release-embedder-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-v2

      - name: Check out matching Flutter engine source
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          ENGINE_REVISION="$(tr -d '[:space:]' < "$FLUTTER_ROOT/bin/internal/engine.version")"
          ENGINE_CHECKOUT="$RUNNER_TEMP/flutter-engine"
          DEPOT_TOOLS="$RUNNER_TEMP/depot_tools"

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS"
          mkdir -p "$ENGINE_CHECKOUT"
          git -C "$ENGINE_CHECKOUT" init
          git -C "$ENGINE_CHECKOUT" remote add origin https://github.com/flutter/flutter.git
          git -C "$ENGINE_CHECKOUT" fetch --depth=1 origin "$ENGINE_REVISION"
          git -C "$ENGINE_CHECKOUT" checkout --detach FETCH_HEAD
          cp "$ENGINE_CHECKOUT/engine/scripts/standard.gclient" "$ENGINE_CHECKOUT/.gclient"

          (
            cd "$ENGINE_CHECKOUT"
            PATH="$DEPOT_TOOLS:$PATH" gclient sync --no-history
          )

          echo "RODIN_FLUTTER_ENGINE_SRC=$ENGINE_CHECKOUT/engine/src" >> "$GITHUB_ENV"
          df -h /

      - name: Build matching AOT release Flutter embedder
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: bash ./tools/build-flutter-engine.sh

      - name: Configure persistent APK signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.RODIN_KEYSTORE_B64 }}
          KEYSTORE_ALIAS: ${{ secrets.RODIN_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.RODIN_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.RODIN_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore configured; this run will use an ephemeral development key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rodin-release.jks"
          echo "RODIN_KEYSTORE=$RUNNER_TEMP/rodin-release.jks" >> "$GITHUB_ENV"
          echo "RODIN_KEY_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          echo "RODIN_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "RODIN_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build MT6897 release
        env:
          RODIN_BUILD_ONLY: "1"
          RODIN_OUTPUT_DIR: ${{ github.workspace }}/out/ci
          RODIN_BUILD_STAMP: github-${{ github.run_number }}-${{ github.sha }}
          RODIN_PLATFORM_VERSION: ${{ env.ANDROID_PLATFORM }}
          RODIN_BUILD_TOOLS_VERSION: ${{ env.ANDROID_BUILD_TOOLS }}
          RODIN_NDK_VERSION: ${{ env.ANDROID_NDK }}
        run: bash ./build-and-install.sh

      - name: Create checksums
        run: |
          cd out/ci
          sha256sum \
            Rodin-Essential.apk \
            host-cargo/aarch64-linux-android/release/rodin_daemon \
            host-cargo/aarch64-linux-android/release/rodin_ctl \
            > SHA256SUMS

      - name: Upload APK and daemon
        uses: actions/upload-artifact@v4
        with:
          name: Rodin-Essential-MT6897-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/ci/Rodin-Essential.apk
            out/ci/host-cargo/aarch64-linux-android/release/rodin_daemon
            out/ci/host-cargo/aarch64-linux-android/release/rodin_ctl
            out/ci/apk-files.txt
            out/ci/SHA256SUMS

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## Rodin Essential MT6897"
            echo
            echo "- Flutter: $FLUTTER_VERSION"
            echo "- Target: Android ARM64 / MT6897 (duchamp)"
            echo "- Installer module: not built"
            echo "- Output: workflow artifact containing APK, daemon and ctl"
          } >> "$GITHUB_STEP_SUMMARY"
